services:
  redoproxy:
    image: ghcr.io/mikhail-angelov/redoproxy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/data/autocert
    environment:
      DISCOVERY_INTERVAL: "60s"
      TLS_ENABLED: "true"
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      ACME_STAGING: "false"
      ACME_EMAIL: "mikhail.angelov@gmail.com"
      ACME_CACHE_DIR: "/data/autocert"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true