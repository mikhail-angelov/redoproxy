services:
  redoproxy:
    image: ghcr.io/mikhail-angelov/redoproxy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs-st:/data/autocert
    environment:
      DISCOVERY_INTERVAL: "60s"
      TLS_ENABLED: "true"
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      ACME_STAGING: "true"
      ACME_EMAIL: "mikhail.angelov@gmail.com"
      ACME_CACHE_DIR: "/data/autocert"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - proxy-net

  app:
    image: nginx:alpine
    labels:
      redoproxy.enabled: "true"
      redoproxy.domain: "example.local"
      redoproxy.port: "80"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true